name: Full Stack Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fullstack-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal typecheck, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontends/portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontends/portal/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build

  backend:
    name: Java backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Make Maven wrapper executable
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw test

  gateway:
    name: Gateway contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run dependency-free gateway tests
        run: node --test gateway/request-timeouts.test.mjs gateway/runtime-config.test.mjs
