spring.application.name=demo
server.address=127.0.0.1
server.port=${SERVER_PORT:8082}

# Java forwards imaging requests to the independent Orthanc service.
orthanc.base-url=${ORTHANC_BASE_URL:http://127.0.0.1:8042}
spring.servlet.multipart.max-file-size=64MB
spring.servlet.multipart.max-request-size=65MB
spring.servlet.multipart.location=${java.io.tmpdir}
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=MEDICAL_DEMO_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Real accounts are managed by the independent Keycloak service.
app.base-url=${APP_BASE_URL:http://127.0.0.1:8080}
keycloak.issuer-uri=${KEYCLOAK_ISSUER_URI:http://127.0.0.1:8081/realms/medical-demo}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:medical-demo-web}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.directory-client-id=${KEYCLOAK_DIRECTORY_CLIENT_ID:medical-demo-directory}
keycloak.directory-client-secret=${KEYCLOAK_DIRECTORY_CLIENT_SECRET:}

# Keep the demo UI current after rebuilding the local application.
spring.web.resources.cache.cachecontrol.no-store=true
spring.web.resources.cache.use-last-modified=false

# Run from backend/; local runtime data belongs outside the source directory.
spring.datasource.url=${APP_DATABASE_URL:jdbc:h2:file:../.runtime/database/access-control;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.h2.console.enabled=false
# A clean checkout has no preinstalled images. Upload new datasets through the API.
app.datasets.seed-enabled=${APP_DATASETS_SEED_ENABLED:false}

# DICOM SEG encoding is delegated to the local, versioned Python codec.
# Java owns authentication, publication versions and Orthanc access. Drafts stay in browser IndexedDB.
app.segmentation.python=${SEGMENTATION_PYTHON:python3}
app.segmentation.codec-script=${SEGMENTATION_CODEC_SCRIPT:python/seg_codec.py}
app.segmentation.work-dir=${SEGMENTATION_WORK_DIR:../.runtime/segmentation}
# After a verified replacement is committed, remove superseded SEG instances in the background.
app.segmentation.cleanup-ms=${SEGMENTATION_CLEANUP_MS:5000}
